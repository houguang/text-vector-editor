[package]
name = "glyphcut"
version = "0.1.0"
description = "文字转矢量线条编辑器 - Text to vector outline editor"
authors = ["houguang"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glyphcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-system-fonts = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.23"
ttf-parser = "0.25"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
